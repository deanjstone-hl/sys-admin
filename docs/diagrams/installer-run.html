<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>An installer run</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: var(--background, #f5f7f8);
      --ink: var(--foreground, #241523);
      --soft: var(--muted-foreground, #6f6873);
      --teal: var(--primary, #0a6f75);
      --rule: var(--border, #cdd4dc);
      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: var(--background, #14181c);
        --ink: var(--foreground, #e8eaed);
        --soft: var(--muted-foreground, #9aa3ad);
        --teal: var(--primary, #4fc3c8);
        --rule: var(--border, #2c343c);
      }
    }
    :root[data-theme="dark"] {
      --paper: var(--background, #14181c);
      --ink: var(--foreground, #e8eaed);
      --soft: var(--muted-foreground, #9aa3ad);
      --teal: var(--primary, #4fc3c8);
      --rule: var(--border, #2c343c);
    }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); padding: 16px; }
    .frame { max-width: 360px; }
    .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); margin-bottom: 4px; }
    h1 { font-size: 20px; font-weight: 600; line-height: 1.2; margin-bottom: 8px; }
    .lede { font-size: 13px; line-height: 1.45; color: var(--soft); margin-bottom: 12px; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 320px; display: block; }
    .src { font-size: 11px; line-height: 1.5; color: var(--soft); margin-top: 12px; }
    .src a { color: var(--teal); }
    .src code { font-family: var(--mono); font-size: 10px; }
    .divider { stroke: var(--rule); stroke-width: 1; }
    .lane { fill: var(--soft); font-family: var(--mono); font-size: 9px; letter-spacing: .12em; }
    .flow { fill: none; stroke: var(--soft); stroke-width: 1.2; }
    .dashed { stroke-dasharray: 5,4; }
    .gate { fill: none; stroke: var(--teal); stroke-width: 1.6; }
    .mask { fill: var(--paper); }
    .tag { fill: var(--soft); font-family: var(--mono); font-size: 9px; letter-spacing: .08em; }
    .tag.teal { fill: var(--teal); }
    .node { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .node.focal { fill: color-mix(in srgb, var(--teal) 14%, var(--paper)); stroke: var(--teal); stroke-width: 1.6; }
    .node.ext { stroke-dasharray: 4,3; }
    .step:target .node { stroke: var(--teal); stroke-width: 2.6; fill: color-mix(in srgb, var(--teal) 22%, var(--paper)); }
    .name { fill: var(--ink); font-family: var(--sans); font-size: 12px; font-weight: 600; text-anchor: middle; }
    .sub { fill: var(--soft); font-family: var(--mono); font-size: 9px; text-anchor: middle; }
    .note { fill: var(--soft); font-family: var(--sans); font-size: 11px; font-style: italic; }
    .key { fill: var(--soft); font-family: var(--sans); font-size: 10px; }
    .head-soft { fill: var(--soft); }
    .head-teal { fill: var(--teal); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process</p>
    <h1>An installer run</h1>
    <p class="lede">What stack/install-wsl2.sh does on the laptop, from dry run to drift check.</p>
    <div class="scroll">
    <svg viewBox="0 0 360 618" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="apply-title apply-desc">
      <title id="apply-title">An installer run</title>
      <desc id="apply-desc">An installer run starts with a dry run, then the deploy-checkout guard, then links config and installs packages, sets up node and binaries, installs systemd units, reports the AI tools and finishes with a drift check.</desc>
      <defs>
        <marker id="apply-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon class="head-soft" points="0 0, 8 3, 0 6"/></marker>
      </defs>
      <path class="flow" d="M 152,80 L 152,104" marker-end="url(#apply-arrow)"/>
      <path class="flow" d="M 152,152 L 152,176" marker-end="url(#apply-arrow)"/>
      <path class="flow" d="M 152,224 L 152,248" marker-end="url(#apply-arrow)"/>
      <path class="flow" d="M 152,296 L 152,320" marker-end="url(#apply-arrow)"/>
      <path class="flow" d="M 152,368 L 152,392" marker-end="url(#apply-arrow)"/>
      <path class="flow" d="M 152,440 L 152,464" marker-end="url(#apply-arrow)"/>
      
            <g id="step-apply-dry" class="step">
      <rect class="node" x="16" y="32" width="272" height="48" rx="6"/>
      <text class="name" x="152" y="53">Dry run</text>
      <text class="sub" x="152" y="68">--dry-run previews and skips the guard</text>
      </g>
      <g id="step-apply-guard" class="step">
      <rect class="node focal" x="16" y="104" width="272" height="48" rx="6"/>
      <text class="name" x="152" y="125">Deploy-checkout guard</text>
      <text class="sub" x="152" y="140">HEAD is origin/deploy, tracked files clean</text>
      </g>
      <g id="step-apply-link" class="step">
      <rect class="node" x="16" y="176" width="272" height="48" rx="6"/>
      <text class="name" x="152" y="197">Symlinks and apt</text>
      <text class="sub" x="152" y="212">config linked, packages from packages.txt</text>
      </g>
      <g id="step-apply-node" class="step">
      <rect class="node" x="16" y="248" width="272" height="48" rx="6"/>
      <text class="name" x="152" y="269">fnm and binaries</text>
      <text class="sub" x="152" y="284">one node only; refuses a second install</text>
      </g>
      <g id="step-apply-units" class="step">
      <rect class="node" x="16" y="320" width="272" height="48" rx="6"/>
      <text class="name" x="152" y="341">systemd units</text>
      <text class="sub" x="152" y="356">system and user units from the repo</text>
      </g>
      <g id="step-apply-tools" class="step">
      <rect class="node" x="16" y="392" width="272" height="48" rx="6"/>
      <text class="name" x="152" y="413">Check the tools</text>
      <text class="sub" x="152" y="428">AI CLIs, Playwright, gh reported</text>
      </g>
      <g id="step-apply-drift" class="step">
      <rect class="node" x="16" y="464" width="272" height="48" rx="6"/>
      <text class="name" x="152" y="485">Drift check</text>
      <text class="sub" x="152" y="500">check-drift.sh: exit 0 clean, 1 drift</text>
      </g>
            <text class="note" x="16" y="540">A real run needs the owner's live approval and a</text>
      <text class="note" x="16" y="554">checkout at origin/deploy. The Windows installers follow</text>
      <text class="note" x="16" y="568">a similar order without the guard.</text>
            <rect class="node" x="8" y="596" width="14" height="10" rx="2"/>
      <text class="key" x="28" y="605">Step</text>
      <rect class="node focal" x="58.8" y="596" width="14" height="10" rx="2"/>
      <text class="key" x="78.8" y="605">Gate</text>
      <line class="flow" x1="109.6" y1="601" x2="133.6" y2="601" marker-end="url(#apply-arrow)"/>
      <text class="key" x="139.6" y="605">Flow</text>
    </svg>
    </div>
    <p class="src">Sources: <code>stack/install-wsl2.sh</code> (section order), <code>scripts/require-deploy-checkout.sh</code>, <code>stack/install-user-units.sh</code>, <code>README.md</code>. Not drawn: the one-time node cutover and the Windows installers.</p>
  </div>
</body>
</html>
