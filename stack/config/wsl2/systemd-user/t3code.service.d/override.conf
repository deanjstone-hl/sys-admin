# Live copy: ~/.config/systemd/user/t3code.service.d/override.conf (a drop-in, so it
# survives `t3 service update`, which rewrites the main unit). See docs/t3code-wsl2-boot.md.
#
# Bind loopback (the default) and let the server configure Tailscale Serve itself.
# Binding the WSL node's tailnet IP instead (T3CODE_HOST=<SYS_ADMIN_TAILSCALE_IP_WSL>) breaks the
# desktop app on this PC: under mirrored networking, Windows routes that IP out through
# its own Tailscale adapter and never reaches WSL. It also races tailscaled at boot.
[Service]
Environment=T3CODE_TAILSCALE_SERVE=true
Environment=T3CODE_TAILSCALE_SERVE_PORT=443
# T3 Connect's managed tunnel needs `cloudflared`, which lives in ~/.local/bin. A systemd user
# service does not get that directory on PATH, and without it the server logs
# "Failed to start the confirmed T3 Connect tunnel ... The relay client is not installed."
# Setting PATH replaces the default, so the system directories are listed too.
Environment=PATH=%h/.local/bin:%h/.local/share/pnpm:%h/.local/share/fnm/aliases/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
